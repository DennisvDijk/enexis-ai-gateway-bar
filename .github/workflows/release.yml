name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Optional. Without these secrets the release is ad-hoc signed (not notarized).
      CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: UI tests
        run: swift run UICheck
      - name: Import signing certificate
        if: env.CERT_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; PW="$(uuidgen)"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials ci-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=ci-notary" >> "$GITHUB_ENV"
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/package.sh
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
